<style>
.code-wrap { position: relative; }
.copy-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  background: #151515;
  color: #b5e853;
  border: 1px solid #b5e853;
  padding: 2px 10px;
  font-family: Monaco, "Bitstream Vera Sans Mono", "Lucida Console", monospace;
  font-size: 12px;
  cursor: pointer;
  z-index: 2;
}
.copy-btn:hover { background: #b5e853; color: #151515; }
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var blocks = document.querySelectorAll('div.highlighter-rouge, pre');
  var seen = [];
  blocks.forEach(function (el) {
    var pre = el.tagName === 'PRE' ? el : el.querySelector('pre');
    if (!pre || seen.indexOf(pre) >= 0) return;
    seen.push(pre);
    var host = el.tagName === 'PRE' ? el : el;
    var wrap = document.createElement('div');
    wrap.className = 'code-wrap';
    host.parentNode.insertBefore(wrap, host);
    wrap.appendChild(host);
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'copy-btn';
    btn.textContent = 'コピー';
    btn.addEventListener('click', function () {
      var text = pre.innerText;
      function done() {
        btn.textContent = 'コピーしました';
        setTimeout(function () { btn.textContent = 'コピー'; }, 1500);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { fallback(); });
      } else { fallback(); }
      function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); } catch (e) {}
        document.body.removeChild(ta);
      }
    });
    wrap.appendChild(btn);
  });
});
</script>
