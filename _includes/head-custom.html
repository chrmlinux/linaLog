<meta property="og:image" content="https://chrmlinux.github.io/linaLog/assets/rina-chan.png">
<meta name="twitter:image" content="https://chrmlinux.github.io/linaLog/assets/rina-chan.png">
<link rel="icon" type="image/png" href="{{ "/assets/favicon.png" | relative_url }}">
<link rel="apple-touch-icon" href="{{ "/assets/favicon.png" | relative_url }}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<link rel="alternate" type="application/rss+xml" title="linaLog RSS" href="/linaLog/feed.xml">
<style>
header { display: none; }
.code-wrap { position: relative; }
.copy-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  background: #151515;
  color: #b5e853;
  border: 1px solid #b5e853;
  padding: 2px 10px;
  font-family: Monaco, "Bitstream Vera Sans Mono", "Lucida Console", monospace;
  font-size: 12px;
  cursor: pointer;
  z-index: 2;
}
.copy-btn:hover { background: #b5e853; color: #151515; }
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var blocks = document.querySelectorAll('div.highlighter-rouge, pre');
  var seen = [];
  blocks.forEach(function (el) {
    var pre = el.tagName === 'PRE' ? el : el.querySelector('pre');
    if (!pre || seen.indexOf(pre) >= 0) return;
    seen.push(pre);
    var host = el.tagName === 'PRE' ? el : el;
    var wrap = document.createElement('div');
    wrap.className = 'code-wrap';
    host.parentNode.insertBefore(wrap, host);
    wrap.appendChild(host);
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'copy-btn';
    btn.textContent = 'コピー';
    btn.addEventListener('click', function () {
      var text = pre.innerText;
      function done() {
        btn.textContent = 'コピーしました';
        setTimeout(function () { btn.textContent = 'コピー'; }, 1500);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { fallback(); });
      } else { fallback(); }
      function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); } catch (e) {}
        document.body.removeChild(ta);
      }
    });
    wrap.appendChild(btn);
  });
});
</script>
<style>
.share-bar {
  margin-top: 32px;
  padding-top: 12px;
  border-top: 1px solid #b5e853;
}
.share-bar .share-label { margin-right: 10px; }
.share-btn {
  display: inline-block;
  background: #151515;
  color: #b5e853;
  border: 1px solid #b5e853;
  padding: 3px 12px;
  margin: 0 8px 8px 0;
  font-family: Monaco, "Bitstream Vera Sans Mono", "Lucida Console", monospace;
  font-size: 13px;
  text-decoration: none;
  cursor: pointer;
}
.share-btn:hover { background: #b5e853; color: #151515; text-decoration: none; }
.share-qr { margin-top: 10px; }
.share-qr-label { color: #b5e853; font-size: 12px; margin-bottom: 4px; }
.share-qr svg { background: #fff; padding: 4px; }
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var main = document.getElementById('main_content');
  if (!main) return;
  var url = encodeURIComponent(location.href);
  var title = document.title.replace(/\s*\|\s*linaLog\s*$/, '');
  var text = encodeURIComponent(title);
  var links = [
    ['X にポスト', 'https://twitter.com/intent/tweet?text=' + text + '&url=' + url],
    ['note で書く', 'https://note.com/intent/post?url=' + url],
    ['LINE で送る', 'https://social-plugins.line.me/lineit/share?url=' + url],
    ['はてなブックマーク', 'https://b.hatena.ne.jp/add?mode=confirm&url=' + url + '&title=' + text]
  ];
  var bar = document.createElement('div');
  bar.className = 'share-bar';
  var home = document.createElement('a');
  home.className = 'share-btn';
  home.href = '/' + location.pathname.split('/')[1] + '/';
  home.textContent = 'トップへ';
  bar.appendChild(home);
  var label = document.createElement('span');
  label.className = 'share-label';
  label.textContent = '共有:';
  bar.appendChild(label);
  links.forEach(function (pair) {
    var a = document.createElement('a');
    a.className = 'share-btn';
    a.href = pair[1];
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = pair[0];
    bar.appendChild(a);
  });
  var rss = document.createElement('a');
  rss.className = 'share-btn';
  rss.href = '/' + location.pathname.split('/').filter(Boolean)[0] + '/feed.xml';
  rss.textContent = 'RSS';
  bar.appendChild(rss);
  if (window.qrcode) {
    try {
      var qr = qrcode(0, 'L');
      qr.addData(url);
      qr.make();
      var box = document.createElement('div');
      box.className = 'share-qr';
      box.innerHTML = '<div class="share-qr-label">QRコード（このページ）</div>' + qr.createSvgTag({ cellSize: 4, margin: 16, scalable: false });
      bar.appendChild(box);
    } catch (e) {}
  }
  main.appendChild(bar);
});
</script>
